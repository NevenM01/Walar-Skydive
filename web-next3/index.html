    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,500&family=Noto+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var k = "walar-theme";
          var t = localStorage.getItem(k);
          var d = document.documentElement;
          if (t === "dark") {
            d.classList.add("dark");
            d.style.colorScheme = "dark";
          } else if (t === "light") {
            d.classList.remove("dark");
            d.style.colorScheme = "light";
          } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            d.classList.add("dark");
            d.style.colorScheme = "dark";
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
