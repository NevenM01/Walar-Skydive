# Production/staging: set in Netlify UI → Site configuration → Environment variables:
#   VITE_SUPABASE_URL   — Supabase project URL (see web-next3/.env.example)
#   VITE_SUPABASE_ANON_KEY — public anon key (never use service role in the frontend)
#
# SPA routing: catch-all below serves index.html with 200 so client-side routes work on refresh.

[build]
  base = "web-next3"
  command = "npm run build"
  publish = "dist"

  [build.environment]
    NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
